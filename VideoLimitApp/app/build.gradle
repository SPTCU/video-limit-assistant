plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videolimit.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.videolimit.app'
        minSdk 24
        targetSdk 33
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

// 纯系统框架实现，无任何第三方依赖
dependencies {
}
